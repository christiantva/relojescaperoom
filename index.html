<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Reloj de la Torre</title>
<style>
/* =====================================================================
   ESTILOS: relojería de juguete (latón, cobre, nogal y crema)
   ===================================================================== */
:root{
  --laton:#D9A441; --laton2:#F0C978; --cobre:#B87333; --nogal:#7A4B2A; --crema:#FFF1DC;
  --coral:#E5533D; --turquesa:#3E9DA8; --verde:#6FB562; --lila:#B79AD8;
  --oscuro:#3B2416; --tinta:#4A2C17; --sombra:rgba(59,36,22,.38);
  --fuente:"Arial Rounded MT Bold","Nunito","Varela Round","Quicksand","Trebuchet MS","Verdana",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2B1A10;font-family:var(--fuente);color:var(--tinta);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#juego{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.oculto{display:none!important}
.panel{background:var(--crema);border:4px solid var(--cobre);border-radius:22px;outline:3px dashed var(--laton);
  outline-offset:-11px;box-shadow:0 7px 0 var(--sombra)}
.btn{font-family:var(--fuente);font-weight:900;font-size:24px;color:var(--oscuro);min-width:56px;min-height:56px;
  padding:8px 20px;border-radius:18px;border:4px solid var(--nogal);background:linear-gradient(#F3CF7E,var(--laton));
  box-shadow:0 6px 0 var(--nogal);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  pointer-events:auto;touch-action:manipulation}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--nogal)}
.btn:focus-visible{outline:4px solid var(--turquesa);outline-offset:3px}
.btn svg{width:36px;height:36px;flex:none}
.btn.coral{background:linear-gradient(#F07A63,var(--coral));color:var(--crema)}
.btn.verde{background:linear-gradient(#93CE86,var(--verde));color:var(--oscuro)}
.btn.crema{background:var(--crema)}
.btn.chico{padding:6px;font-size:20px}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#objetivo{position:absolute;left:14px;top:12px;display:flex;align-items:center;gap:12px;padding:10px 20px 10px 12px;
  max-width:min(52vw,560px);font-size:clamp(18px,2.4vw,27px);font-weight:900;line-height:1.15}
#objetivo .ico svg{width:58px;height:58px;display:block}
#minimapa{position:absolute;right:14px;top:12px;display:flex;gap:4px;padding:8px 14px}
#minimapa .eng svg{width:46px;height:46px;display:block;transition:transform .3s}
#minimapa .eng.lleno svg{filter:drop-shadow(0 0 6px #FFD56B)}
#minimapa .eng.pop svg{animation:pop .7s ease-out}
#botonesTop{position:absolute;right:14px;top:96px;display:flex;gap:10px}
#subtitulo{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;
  padding:10px 26px 10px 12px;max-width:min(900px,calc(100vw - 400px));min-width:min(420px,90vw);min-height:76px;font-size:clamp(22px,3.1vw,36px);font-weight:900;
  line-height:1.15;transition:opacity .25s}
#subtitulo .ico svg{width:62px;height:62px;display:block}
#subtitulo .pic svg{width:54px;height:54px;display:block}
#subtitulo.vacio{opacity:0}
#btnVolver{position:absolute;left:16px;bottom:16px;font-size:26px;min-height:68px}
#btnMesa{position:absolute;right:16px;bottom:16px;font-size:26px;min-height:68px}
#btnSaltar{position:absolute;right:16px;bottom:16px}
#btnListo{position:absolute;left:0;top:0;font-size:30px;min-height:76px;min-width:150px;transform:translate(-50%,-50%)}
#btnListo:active{transform:translate(-50%,calc(-50% + 4px))}
#btnListo.pulso{animation:latido 1.2s ease-in-out infinite}
.etq{position:absolute;left:0;top:0;transform:translate(-50%,-120%);padding:6px 14px;border-radius:16px;font-weight:900;
  font-size:24px;color:var(--crema);border:3px solid var(--crema);box-shadow:0 4px 0 var(--sombra);display:flex;gap:6px;align-items:center}
.etq svg{width:30px;height:30px}
#etqHora{background:var(--coral);transform:translate(-50%,35%)} #etqMin{background:var(--turquesa);transform:translate(-50%,-135%)}
#nombrar{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(1);display:flex;flex-direction:column;
  align-items:center;gap:6px;padding:18px 40px;font-size:clamp(44px,8vw,104px);font-weight:900;color:var(--tinta);
  text-align:center;white-space:nowrap}
#nombrar svg{width:clamp(70px,10vw,120px);height:clamp(70px,10vw,120px)}
#nombrar.ver{animation:aparecer .45s cubic-bezier(.3,1.6,.5,1)}
#teclas{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);display:flex;gap:18px;padding:8px 18px;align-items:center;
  font-size:22px;font-weight:900}
#teclas svg{width:120px;height:64px}
#vuela{position:fixed;width:60px;height:60px;z-index:7;pointer-events:none;transition:left .9s cubic-bezier(.5,0,.3,1),top .9s cubic-bezier(.5,0,.3,1),transform .9s}
#vuela svg{width:100%;height:100%;filter:drop-shadow(0 0 10px #FFD56B)}
#progresoFinal{position:absolute;left:14px;top:110px;display:flex;gap:6px;padding:6px 14px}
#progresoFinal svg{width:40px;height:40px}
/* ---------- Pantallas ---------- */
.pantalla{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(122,75,42,.35),rgba(43,26,16,.78));overflow:auto;padding:16px}
.pantalla .caja{max-width:760px;width:100%;padding:26px 30px;text-align:center}
h1{margin:4px 0 8px;font-size:clamp(34px,6vw,64px);color:var(--nogal);line-height:1.05;text-shadow:0 3px 0 var(--laton2)}
h2{margin:6px 0;font-size:clamp(24px,3.6vw,38px);color:var(--nogal)}
.sub{font-size:22px;margin:0 0 14px}
.fila{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;margin:12px 0}
#nombre{font-family:var(--fuente);font-weight:900;font-size:30px;padding:10px 18px;min-height:64px;width:min(420px,80vw);
  border-radius:16px;border:4px solid var(--cobre);background:#FFFDF6;color:var(--tinta);text-align:center}
#btnJugar{font-size:46px;min-height:96px;min-width:260px;padding:10px 40px}
#btnJugar svg{width:52px;height:52px}
#opciones{display:grid;gap:10px;justify-content:center;margin-top:10px;text-align:left}
#opciones label{display:flex;align-items:center;gap:14px;font-size:24px;font-weight:900;cursor:pointer;min-height:56px}
#opciones input{width:38px;height:38px;accent-color:var(--turquesa);cursor:pointer}
.logo svg{width:110px;height:110px}
#estrellas svg{width:clamp(64px,10vw,96px);height:clamp(64px,10vw,96px)}
#aprendi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0;text-align:left}
#aprendi .item{display:flex;align-items:center;gap:10px;background:#FFF8EA;border:3px solid var(--laton);border-radius:16px;
  padding:8px 10px;font-size:20px;font-weight:900}
#aprendi svg{width:52px;height:52px;flex:none}
#datosRes{font-size:24px;font-weight:900}
#lineaRes{font-family:var(--fuente);font-size:15px;background:#FFF8EA;border:2px dashed var(--cobre);border-radius:10px;padding:8px;
  margin:8px auto;max-width:640px;-webkit-user-select:text;user-select:text;word-break:break-word}
/* ---------- Depuración ---------- */
#debug{position:fixed;left:10px;top:170px;z-index:20;background:rgba(255,241,220,.93);border:3px solid var(--cobre);border-radius:12px;
  padding:8px 12px;font:14px/1.35 ui-monospace,Menlo,Consolas,monospace;color:var(--oscuro);white-space:pre;pointer-events:none}
#autotest{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;width:min(720px,94vw);max-height:84vh;overflow:auto;
  padding:16px 20px;font:15px/1.4 ui-monospace,Menlo,Consolas,monospace;pointer-events:auto}
#autotest .gran{font:900 46px var(--fuente);text-align:center}
#autotest .ok{color:#3F7F35} #autotest .mal{color:var(--coral)}
#aviso{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#3B2416;color:var(--crema);
  font-size:26px;text-align:center;padding:30px}
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:25;pointer-events:none;padding:14px 26px;font-size:26px;font-weight:900}
@keyframes pop{0%{transform:scale(.4) rotate(-90deg)}60%{transform:scale(1.35) rotate(20deg)}100%{transform:scale(1) rotate(0)}}
@keyframes aparecer{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes latido{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.08)}}
@media (max-width:760px){#objetivo{max-width:60vw} #minimapa .eng svg{width:34px;height:34px} #botonesTop{top:78px}}
.reducido *{animation:none!important;transition:none!important}
</style>
</head>
<body>
<canvas id="juego" tabindex="0" aria-label="Sala del Mecanismo de la Torre"></canvas>

<div id="hud" class="oculto">
  <div id="objetivo" class="panel"><span class="ico"></span><span class="txt"></span></div>
  <div id="minimapa" class="panel" aria-label="Engranajes encontrados"></div>
  <div id="botonesTop">
    <button id="btnPausa" class="btn chico crema" title="Pausa (Esc o P)" aria-label="Pausa"></button>
    <button id="btnMute" class="btn chico crema" title="Silencio (M)" aria-label="Silencio"></button>
  </div>
  <div id="progresoFinal" class="panel oculto"></div>
  <div id="teclas" class="panel oculto"></div>
  <div id="subtitulo" class="panel vacio"><span class="ico"></span><span class="txt"></span><span class="pic"></span></div>
  <button id="btnVolver" class="btn oculto"></button>
  <button id="btnMesa" class="btn verde oculto"></button>
  <button id="btnSaltar" class="btn crema oculto"></button>
  <button id="btnListo" class="btn verde oculto"></button>
  <div id="etqHora" class="etq oculto"></div>
  <div id="etqMin" class="etq oculto"></div>
  <div id="nombrar" class="panel oculto"></div>
</div>
<div id="vuela" class="oculto"></div>

<div id="menu" class="pantalla">
  <div class="caja panel">
    <div class="logo" id="logoMenu"></div>
    <h1>El Reloj de la Torre</h1>
    <p class="sub">¡El reloj se detuvo! Ayuda a Cucú.</p>
    <div class="fila"><input id="nombre" maxlength="18" placeholder="Tu nombre" autocomplete="off" aria-label="Tu nombre"></div>
    <div class="fila"><button id="btnJugar" class="btn coral"></button></div>
    <div class="fila"><button id="btnOpciones" class="btn crema">Opciones</button></div>
    <div id="opciones" class="oculto">
      <label><input type="checkbox" id="opClic"> Modo clic (toca y toca)</label>
      <label><input type="checkbox" id="opEfectos"> Reducir efectos</label>
      <label><input type="checkbox" id="opVoz" checked> Voz de Cucú</label>
    </div>
  </div>
</div>

<div id="pausa" class="pantalla oculto">
  <div class="caja panel">
    <h1>Pausa</h1>
    <div class="fila"><button id="btnSeguir" class="btn verde">Seguir</button><button id="btnMuteP" class="btn crema">Sonido</button></div>
    <p class="sub">Esc o P para seguir</p>
  </div>
</div>

<div id="resultado" class="pantalla oculto">
  <div class="caja panel">
    <h1 id="tituloRes">¡El pueblo despertó!</h1>
    <div id="datosRes"></div>
    <div id="estrellas" class="fila"></div>
    <h2>Lo que aprendí</h2>
    <div id="aprendi"></div>
    <div id="lineaRes"></div>
    <div class="fila">
      <button id="btnCopiar" class="btn crema">Copiar resultado</button>
      <button id="btnOtra" class="btn coral">Jugar otra vez</button>
    </div>
  </div>
</div>

<div id="debug" class="oculto"></div>
<div id="autotest" class="panel oculto"></div>
<div id="toast" class="panel oculto"></div>
<div id="aviso" class="oculto"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- Respaldo sin internet: si cdnjs no responde, se usa three.min.js (r128) guardado junto a este archivo -->
<script>if (!window.THREE) document.write('<script src="three.min.js"><\/script>');</script>
<script>
'use strict';
/* =====================================================================
   1. CONFIG: números del juego (medidas en metros, tiempos en segundos)
   ===================================================================== */
const CONFIG = {
  DT_MAX: 0.05,
  SALA: { radio: 9, alto: 6 },
  MESA: { ancho: 2.6, fondo: 1.4, alto: 0.95, radioCirculo: 5.6, n: 7 },
  JUGADOR: { ojo: 1.45, radio: 0.35, vel: 2.3, giro: 1.9, inclMax: 35 },
  CAM: { fov: 60, transicion: 0.8, inclMesa: 40, entrar: 2.5, salir: 3.2 },
  ARRASTRE: {
    alturaPlano: 0.12,     // el rayo corta SOLO este plano: mesa + 0.12 m
    umbralPx: 6,           // menos de 6 px = clic (toca y toca)
    umbralPxClic: 18,      // en "modo clic" se perdona un poco más de movimiento
    extraEncaje: 0.18,     // radio de encaje = radio de la ranura + 0.18
    extraPista: 0.15,      // +0.15 m cuando hay pista activa
    radioPerilla: 0.12,    // radio de selección de la perilla dorada
    tSnap: 0.35, tVuelta: 0.3,
    margen: 0.05           // las piezas no salen del tablero
  },
  PISTAS: { t1: 20, t2: 40, t3: 70 },
  ERRORES_AYUDA: 2,
  ESTRELLAS: { tres: 2, dos: 5 },   // pistas <= 2: 3 estrellas; <= 5: 2; más: 1
  RENDER: { prMax: 1.5, prModesto: 1, prMin: 0.7, fpsMin: 40, fpsVentana: 3, maxDrawCalls: 70, maxTriangulos: 40000 },
  PARTICULAS: { total: 120, polvo: 56, polvoReducido: 18 },
  AUDIO: { maxNodos: 8, volumen: 0.55 },
  VOZ: { pitch: 1.4, rate: 0.92 },
  VISTA: { xMax: 0.95, yMin: -0.58, yMax: 0.78 },   // zona segura en pantalla (NDC) para la vista de mesa
  COL: {
    laton: 0xD9A441, cobre: 0xB87333, nogal: 0x7A4B2A, crema: 0xFFF1DC, coral: 0xE5533D, turquesa: 0x3E9DA8,
    verde: 0x6FB562, lila: 0xB79AD8, oscuro: 0x3B2416, tinta: 0x4A2C17, oro: 0xFFD56B, cielo: 0xBFE0EE
  }
};
const C = { // colores para canvas y SVG
  laton: '#D9A441', laton2: '#F0C978', cobre: '#B87333', nogal: '#7A4B2A', crema: '#FFF1DC', coral: '#E5533D',
  turq: '#3E9DA8', verde: '#6FB562', lila: '#B79AD8', osc: '#4A2C17', oscuro: '#3B2416', oro: '#FFD56B',
  cielo: '#BFE0EE', noche: '#3D4A86', apagado: '#E3D2B8', apagado2: '#B89A78', blanco: '#FFFDF6'
};
const FUENTE = '"Arial Rounded MT Bold","Nunito","Varela Round","Quicksand","Trebuchet MS","Verdana",sans-serif';

/* =====================================================================
   2. CONTENIDO: cada línea tiene sub (máx. 6 palabras), voz e ícono
   ===================================================================== */
const DIAS = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'setiembre', 'octubre', 'noviembre', 'diciembre'];
const NUM_HORA = ['doce', 'una', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce'];
const NUM = ['cero', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce'];

function T(sub, voz, icono, pic) { return { sub: sub, voz: voz || sub, icono: icono || 'cucu', pic: pic || null }; }
function art(h) { return h === 1 ? 'la' : 'las'; }
function horaTxt(h, media) { return art(h) + ' ' + h + (media ? ' y media' : ' en punto'); }
function horaVoz(h, media) { return art(h) + ' ' + NUM_HORA[h] + (media ? ' y media' : ' en punto'); }
function digital(h, media) { return h + (media ? ':30' : ':00'); }
function capital(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function sig(h) { return h % 12 + 1; }

const CONTENIDO = {
  // Historia
  hola: T('¡Hola! Soy Cucú.', '¡Hola! Soy Cucú.'),
  relojParado: T('El gran reloj se detuvo.', null, 'cucu', 'reloj:12:0'),
  congelado: T('Todo quedó congelado a las 12.', 'Todo quedó congelado a las doce.', 'cucu', 'reloj:12:0'),
  ayudante: n => (n === 'Ayudante' ? T('Eres mi nuevo ayudante.', null, 'cucu', 'mano') : T(n + ', eres mi ayudante.', null, 'cucu', 'mano')),
  buscar: T('Busquemos 5 engranajes dorados.', 'Busquemos cinco engranajes dorados.', 'cucu', 'engranaje'),
  caminar: T('Camina con W A S D.', 'Camina con las teclas W, A, S y D.', 'cucu', 'teclas'),
  mirar: T('Mira con las flechas.', null, 'cucu', 'flechas'),
  irMesa: T('Ve a la mesa brillante.', null, 'cucu', 'mesa'),
  esaMesa: T('Esa mesa espera su turno.', null, 'cucu', 'mesa'),
  botonMesa: T('Toca Mesa para volver.', null, 'cucu', 'mesa'),
  // Práctica
  pracArrastra: T('Arrastra el engranaje a su eje.', null, 'cucu', 'engranaje'),
  pracToca: T('Toca el engranaje y su eje.', null, 'cucu', 'mano'),
  pracBien: T('¡Gira! ¡Lo lograste!', null, 'cucu', 'engranaje'),
  pracTocar: T('También puedes tocar y tocar.', 'También puedes tocar la pieza, y luego su lugar.', 'cucu', 'mano'),
  pracVamos: T('¡Ahora, a buscar engranajes!', null, 'cucu', 'engranaje'),
  // Partes del reloj
  partesIntro: T('Al reloj le faltan números.', null, 'cucu', 'reloj'),
  partesPon: T('Pon cada número en su lugar.', null, 'cucu', 'reloj'),
  partesDemo: T('Mira: el 12 va arriba.', 'Mira: el doce va arriba.', 'cucu', 'reloj:12:0'),
  partesErr: {
    12: T('El 12 va arriba.', 'El doce va arriba.'), 3: T('El 3 va a la derecha.', 'El tres va a la derecha.'),
    6: T('El 6 va abajo.', 'El seis va abajo.'), 9: T('El 9 va a la izquierda.', 'El nueve va a la izquierda.')
  },
  partesBien: T('¡Muy bien! 12, 3, 6, 9.', '¡Muy bien! Doce, tres, seis, nueve.', 'cucu', 'reloj'),
  manosIntro: T('Ahora, las manecillas.', null, 'cucu', 'reloj'),
  cortaDice: T('La corta dice la hora.', null, 'campana', 'campana'),
  largaDice: T('La larga dice los minutos.', null, 'arena', 'arena'),
  cortaACampana: T('Pon la corta en la campana.', null, 'campana', 'campana'),
  largaAArena: T('La larga, al reloj de arena.', null, 'arena', 'arena'),
  manosBien: T('¡Armamos el reloj!', null, 'cucu', 'reloj'),
  // Hora en punto y media hora
  puntoIntro: T('Ahora: la hora en punto.', null, 'cucu', 'reloj:3:0'),
  mediaIntro: T('Ahora: la media hora.', null, 'cucu', 'reloj:4:30'),
  demoMira: (h, media) => T('Mira: ' + horaTxt(h, media) + '.', 'Mira: ' + horaVoz(h, media) + '.', 'cucu', 'reloj:' + h + ':' + (media ? 30 : 0)),
  largaEn12: T('La larga en el 12.', 'La larga en el doce.', 'arena', 'arena'),
  largaEn6: T('La larga en el 6.', 'La larga en el seis.', 'arena', 'arena'),
  cortaEn: h => T('La corta en el ' + h + '.', 'La corta en el ' + NUM[h] + '.', 'campana', 'campana'),
  cortaEntre: h => T('La corta: entre ' + h + ' y ' + sig(h) + '.', 'La corta, entre el ' + NUM[h] + ' y el ' + NUM[sig(h)] + '.', 'campana', 'campana'),
  poner: (h, media) => T('Pon ' + horaTxt(h, media) + '.', 'Pon ' + horaVoz(h, media) + '.', 'cucu', 'reloj:' + h + ':' + (media ? 30 : 0)),
  tocaListo: T('Luego toca el botón Listo.', null, 'cucu', 'check'),
  errLarga12: T('La larga va en el 12.', 'La larga va en el doce.', 'arena', 'arena'),
  errLarga6: T('La larga va en el 6.', 'La larga va en el seis.', 'arena', 'arena'),
  errCortaEn: h => T('La corta va en el ' + h + '.', 'La corta va en el ' + NUM[h] + '.', 'campana', 'campana'),
  teAyudo: T('Mira, yo te ayudo.', null, 'cucu', 'mano'),
  bien: [T('¡Muy bien!'), T('¡Excelente!'), T('¡Lo hiciste!'), T('¡Genial!')],
  leerPregunta: T('¿Qué hora marca el reloj?', null, 'cucu', 'reloj'),

  p(obj, dur, fn, ease) { return new Promise(res => { const t = this.a(obj, dur, fn, ease, res); t.res = res; }); },
  cancelar(obj) {

  update(dt) {

      const k = t.t >= t.dur ? 1 : t.t / t.dur;
      t.fn(t.ease(k), k);

const RELOJ = { t: 0 };     // tiempo de juego (se detiene en PAUSA)

function esperarT(ctx, s) { return new Promise((res, rej) => ESPERAS.push({ tipo: 0, fin: RELOJ.t + s, cond: null, res: res, rej: rej, ctx: ctx })); }
function esperarC(ctx, cond) { return new Promise((res, rej) => ESPERAS.push({ tipo: 1, fin: 0, cond: cond, res: res, rej: rej, ctx: ctx })); }

  for (let i = ESPERAS.length - 1; i >= 0; i--) {
    const w = ESPERAS[i];
    if (!w) continue;
    if (w.ctx && !w.ctx.vivo) { ESPERAS.splice(i, 1); w.rej(CANCEL); continue; }
    let listo = false;
    if (w.tipo === 0) listo = RELOJ.t >= w.fin;

   10. SONIDO (Web Audio API). Se cuentan los nodos: máximo 8 a la vez.
   ===================================================================== */
const AUD = {
  ctx: null, master: null, activos: 0, mute: false, ruido: null, ondaCampana: null, intervalo: 0, paso: 0,
  melodia: [76, 79, 84, 79, 81, 79, 76, 0, 77, 76, 74, 76, 72, 0, 0, 0, 74, 76, 77, 79, 81, 79, 77, 76, 74, 72, 74, 76, 72, 0, 0, 0],
  iniciar() {
    if (this.ctx) { try { if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) { } return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = CONFIG.AUDIO.volumen;
      this.master.connect(this.ctx.destination);
      const n = Math.floor(this.ctx.sampleRate * 0.25);
      this.ruido = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = this.ruido.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const real = new Float32Array([0, 0, 0, 0, 0, 0, 0, 0, 0]);
      const imag = new Float32Array([0, 1, 0.55, 0.42, 0.18, 0.26, 0.08, 0.12, 0.05]);
      this.ondaCampana = this.ctx.createPeriodicWave(real, imag);
      if (this.ctx.state === 'suspended') this.ctx.resume();
      this.intervalo = setInterval(() => this.fondo(), 125);
    } catch (e) { this.ctx = null; }
  },
  puede(costo, limite) { return !!this.ctx && !this.mute && this.activos + costo <= Math.min(limite, CONFIG.AUDIO.maxNodos); },
  nota(f, dur, o) {
    o = o || {};
    if (o.cuando > 0.02) {               // se agenda para después: los nodos se crean recién al sonar
      const diferida = Object.assign({}, o, { cuando: 0 });
      setTimeout(() => this.nota(f, dur, diferida), o.cuando * 1000);
      return;
    }
    if (!this.puede(2, o.limite || CONFIG.AUDIO.maxNodos)) return;
    try {
      const t0 = this.ctx.currentTime;
      const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
      if (o.onda) osc.setPeriodicWave(o.onda); else osc.type = o.tipo || 'sine';
      osc.frequency.setValueAtTime(f, t0);

      this.activos += 2;
      osc.onended = () => { this.activos = Math.max(0, this.activos - 2); try { osc.disconnect(); g.disconnect(); } catch (e) { } };
    } catch (e) { }
  },
  golpe(dur, vol, frec) {
    if (!this.ruido || !this.puede(3, CONFIG.AUDIO.maxNodos)) return;
    try {
      const t0 = this.ctx.currentTime, s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
      s.buffer = this.ruido; f.type = 'bandpass'; f.frequency.value = frec; f.Q.value = 3;

    } catch (e) { }

  hz(midi) { return 440 * Math.pow(2, (midi - 69) / 12); },
  // Fondo: tic-tac suave y cajita de música (solo usan nodos libres)
  fondo() {
    if (!this.ctx || this.mute || !G.audioFondo || G.estado === 'PAUSA') return;
    this.paso++;
    if (this.paso % 4 === 0) this.nota((this.paso / 4) % 2 ? 1900 : 1500, 0.03, { tipo: 'triangle', vol: 0.022, limite: 6 });
    if (G.musica && this.paso % 3 === 0) {
      const m = this.melodia[(this.paso / 3) % this.melodia.length];

  },
  tic() { this.nota(2700, 0.05, { tipo: 'triangle', vol: 0.14 }); },
  toc() { this.golpe(0.09, 0.55, 750); this.nota(330, 0.16, { tipo: 'sine', vol: 0.25, desliz: 210 }); },
  acierto() { const f = [1046.5, 1318.5, 1568]; for (let i = 0; i < 3; i++) this.nota(f[i], 0.5, { tipo: 'sine', vol: 0.12, cuando: i * 0.09 }); },
  suave() { this.nota(392, 0.24, { tipo: 'triangle', vol: 0.1, desliz: 330 }); },   // aviso amable de error, sin castigo

   11. VOZ DE CUCÚ (speechSynthesis: es-PE, si no es-ES, si no es)
   ===================================================================== */
const VOZ = {
  ok: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined',
  voz: null, lista: 0,
  elegir() {
    if (!this.ok) return;
    let vs = [];
    try { vs = speechSynthesis.getVoices() || []; } catch (e) { vs = []; }
    this.lista = vs.length;
    const busca = re => { for (let i = 0; i < vs.length; i++) if (re.test(String(vs[i].lang).replace('_', '-'))) return vs[i]; return null; };
    this.voz = busca(/^es-PE/i) || busca(/^es-ES/i) || busca(/^es/i) || null;
  },
  hablar(texto, alTerminar) {
    if (!this.ok || !G.opc.voz || AUD.mute) return false;
    if (this.lista > 0 && !this.voz) return false;     // hay voces pero ninguna en español: solo subtítulos
    try {
      const u = new SpeechSynthesisUtterance(texto);
      if (this.voz) { u.voice = this.voz; u.lang = this.voz.lang; } else u.lang = 'es-ES';
      u.pitch = CONFIG.VOZ.pitch; u.rate = CONFIG.VOZ.rate; u.volume = 1;
      u.onend = alTerminar; u.onerror = alTerminar;
      speechSynthesis.speak(u);
      return true;
    } catch (e) { return false; }
  },
  callar() { if (this.ok) { try { speechSynthesis.cancel(); } catch (e) { } } }
};
if (VOZ.ok) {
  VOZ.elegir();
  try { speechSynthesis.addEventListener('voiceschanged', () => VOZ.elegir()); } catch (e) { speechSynthesis.onvoiceschanged = () => VOZ.elegir(); }
}

function decir(linea, op) {
  op = op || {};
  if (!linea) return Promise.resolve();
  if (typeof linea === 'string') linea = T(linea);
  UI.subtitulo(linea);
  if (op.interrumpir) VOZ.callar();
  const pal = contarPalabras(linea.sub);
  const tMin = 1.0 + pal * 0.36, tMax = 2.6 + pal * 0.8 + Math.max(0, linea.voz.length - linea.sub.length) * 0.05;
  const t0 = RELOJ.t;
  let fin = false;
  if (!VOZ.hablar(linea.voz, () => { fin = true; })) fin = true;
  if (typeof CUCU !== 'undefined' && CUCU.hablar) CUCU.hablar(tMin);
  return new Promise(res => ESPERAS.push({ tipo: 1, fin: 0, cond: () => (fin && RELOJ.t - t0 >= tMin) || RELOJ.t - t0 >= tMax, res: res, rej: res, ctx: null }));
}

/* =====================================================================
   13. PARTÍCULAS: polvo dorado y chispas (pool fijo de 120)
   ===================================================================== */
const PART = {
  n: CONFIG.PARTICULAS.total, puntos: null, pos: null, col: null, vel: null, vida: null, max: null, tipo: null, polvo: 0,
  caminoOn: false, caminoA: new THREE.Vector3(), caminoB: new THREE.Vector3(), caminoT: 0,
  crear() {
    const n = this.n, np = this.np = CONFIG.PARTICULAS.polvo;
    this.pos = new Float32Array(n * 3); this.col = new Float32Array(n * 3);
    this.vel = new Float32Array(n * 3); this.vida = new Float32Array(n); this.max = new Float32Array(n); this.tipo = new Uint8Array(n);
    // Un solo pool de 120: el polvo usa [0, np) con brillo aditivo; las chispas [np, 120) con estrellitas visibles sobre la mesa
    const geo = (a, b) => {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(this.pos.subarray(a * 3, b * 3), 3).setUsage(THREE.DynamicDrawUsage));
      g.setAttribute('color', new THREE.BufferAttribute(this.col.subarray(a * 3, b * 3), 3).setUsage(THREE.DynamicDrawUsage));
      return g;
    };
    const matPolvo = new THREE.PointsMaterial({ size: 0.09, map: TEX.brillo, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true });
    const matChispa = new THREE.PointsMaterial({ size: 0.1, map: TEX.chispa, vertexColors: true, transparent: true, depthWrite: false, alphaTest: 0.08, sizeAttenuation: true });
    this.puntos = new THREE.Points(geo(0, np), matPolvo);
    this.chispas = new THREE.Points(geo(np, n), matChispa);
    this.puntos.frustumCulled = false; this.chispas.frustumCulled = false;
    this.chispas.renderOrder = 5;
    R.scene.add(this.puntos); R.scene.add(this.chispas);
    for (let i = 0; i < n; i++) this.apagar(i);
    this.ajustarPolvo(G.opc.reducir ? CONFIG.PARTICULAS.polvoReducido : CONFIG.PARTICULAS.polvo);
  },
  apagar(i) { this.tipo[i] = 0; this.pos[i * 3 + 1] = -50; this.col[i * 3] = this.col[i * 3 + 1] = this.col[i * 3 + 2] = 0; },
  ajustarPolvo(n) {
    this.polvo = n = Math.min(n, this.np);
    for (let i = 0; i < this.np; i++) {
      if (i < n) { if (this.tipo[i] !== 1) this.nacerPolvo(i, true); }
      else if (this.tipo[i] === 1) this.apagar(i);
    }
  },
  nacerPolvo(i, alAzar) {
    const a = Math.random() * TAU, r = Math.sqrt(Math.random()) * 8;
    this.tipo[i] = 1;
    this.pos[i * 3] = Math.cos(a) * r; this.pos[i * 3 + 1] = alAzar ? 0.3 + Math.random() * 4.5 : 0.2; this.pos[i * 3 + 2] = Math.sin(a) * r;
    this.vel[i * 3] = (Math.random() - 0.5) * 0.06; this.vel[i * 3 + 1] = 0.02 + Math.random() * 0.05; this.vel[i * 3 + 2] = (Math.random() - 0.5) * 0.06;
    this.vida[i] = 0; this.max[i] = 9 + Math.random() * 9;
  },
  libre() { for (let i = this.np; i < this.n; i++) if (this.tipo[i] === 0) return i; return -1; },
  chispa(x, y, z, vx, vy, vz, vida, r, g, b, tipo) {
    const i = this.libre(); if (i < 0) return;
    this.tipo[i] = tipo || 2;
    this.pos[i * 3] = x; this.pos[i * 3 + 1] = y; this.pos[i * 3 + 2] = z;
    this.vel[i * 3] = vx; this.vel[i * 3 + 1] = vy; this.vel[i * 3 + 2] = vz;
    this.vida[i] = 0; this.max[i] = vida;
    this.col[i * 3] = r; this.col[i * 3 + 1] = g; this.col[i * 3 + 2] = b;
  },
  estallido(x, y, z, n, fuerza) {
    const k = G.opc.reducir ? Math.ceil(n / 3) : n;
    for (let j = 0; j < k; j++) {
      const a = Math.random() * TAU, e = Math.random() * 0.9 + 0.3, f = (fuerza || 1) * (0.6 + Math.random() * 0.8);
      this.chispa(x, y, z, Math.cos(a) * Math.cos(e) * f, Math.sin(e) * f * 1.3, Math.sin(a) * Math.cos(e) * f, 0.7 + Math.random() * 0.6, 1, 0.82 + Math.random() * 0.15, 0.45, 2);
    }
  },
  camino(a, b) { this.caminoA.copy(a); this.caminoB.copy(b); this.caminoOn = true; this.caminoT = 0; },
  sinCamino() { this.caminoOn = false; },
  update(dt, t) {
    const p = this.pos, v = this.vel, c = this.col;
    if (this.caminoOn) {
      this.caminoT += dt;
      if (this.caminoT > (G.opc.reducir ? 0.16 : 0.06)) {
        this.caminoT = 0;
        const i = this.libre();
        if (i >= 0) {
          this.tipo[i] = 3; this.vida[i] = 0; this.max[i] = 1.4;
          p[i * 3] = this.caminoA.x; p[i * 3 + 1] = this.caminoA.y; p[i * 3 + 2] = this.caminoA.z;
          v[i * 3] = (this.caminoB.x - this.caminoA.x) / 1.4; v[i * 3 + 1] = (this.caminoB.y - this.caminoA.y) / 1.4; v[i * 3 + 2] = (this.caminoB.z - this.caminoA.z) / 1.4;
          c[i * 3] = 1; c[i * 3 + 1] = 0.85; c[i * 3 + 2] = 0.4;
        }
      }
    }
    for (let i = 0; i < this.n; i++) {
      const tp = this.tipo[i];
      if (tp === 0) continue;
      this.vida[i] += dt;
      const k = this.vida[i] / this.max[i];
      if (k >= 1) { if (tp === 1) this.nacerPolvo(i, false); else this.apagar(i); continue; }
      p[i * 3] += v[i * 3] * dt; p[i * 3 + 1] += v[i * 3 + 1] * dt; p[i * 3 + 2] += v[i * 3 + 2] * dt;
      if (tp === 1) {
        const br = Math.sin(k * Math.PI) * (0.35 + 0.15 * Math.sin(t * 2 + i));
        c[i * 3] = br; c[i * 3 + 1] = br * 0.78; c[i * 3 + 2] = br * 0.4;
        p[i * 3] += Math.sin(t * 0.7 + i) * 0.002;
      } else if (tp === 2) {
        v[i * 3 + 1] -= 2.2 * dt;
        c[i * 3] = 1; c[i * 3 + 1] = 0.92 + Math.sin(t * 20 + i) * 0.08; c[i * 3 + 2] = 0.75;
      } else {
        c[i * 3] = 1; c[i * 3 + 1] = 0.95; c[i * 3 + 2] = 0.8;
        p[i * 3 + 1] += Math.sin(t * 9 + i) * 0.004;
      }
    }
    this.puntos.geometry.attributes.position.needsUpdate = true;
    this.puntos.geometry.attributes.color.needsUpdate = true;
    this.chispas.geometry.attributes.position.needsUpdate = true;
    this.chispas.geometry.attributes.color.needsUpdate = true;
  }
};

// ---------- Tipo B: manecillas ----------

  const nm = nearestMark(m.tipo, a, rl.modo);

}
function mostrarLuzMarca(m, ang) {

}
function soltarMano(m) {
  const nm = nearestMark(m.tipo, m.obj, m.reloj.modo);

// ---------- Toca y toca ----------

}
function deseleccionar() {
  const s = DRAG.sel;
  if (!s) return;
  DRAG.sel = null;
  if (s.tipo === 'pieza') { if (!s.obj.colocada && !TW.activo(s.obj.obj)) s.obj.obj.position.y = s.obj.y0; }
  else { if (s.obj.reloj.brillo === s.obj.tipo) s.obj.reloj.brillo = null; s.obj.reloj.luz.visible = false; }
}
function enviarSeleccion() {
  const s = DRAG.sel;
  if (!s) return;
  if (s.tipo === 'pieza') {
    const p = s.obj;
    puntoAltura(0.006, _pk);
    const c = findCandidate(p, _pk.x, _pk.z, EST.ranuras, bonusEncaje(p));
    if (c) { encajar(p, c.ranura, false); return; }
    const n = ranuraCercana(_pk.x, _pk.z, EST.ranuras, bonusEncaje(p));
    deseleccionar();
    if (n && !n.ranura.accepts(p)) { n.ranura.flash = 0.9; registrarError(p, n.ranura); }

const TECLAS_MOV = { KeyW: 1, KeyA: 1, KeyS: 1, KeyD: 1, ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1 };
function alTecla(ev, abajo) {
  const enCampo = document.activeElement && document.activeElement.tagName === 'INPUT' && document.activeElement.type === 'text';
  if (enCampo) { if (abajo && ev.code === 'Enter') UI.jugar(); return; }
  const code = ev.code;
  if (abajo && !ev.repeat) {
    const panelTest = UI.el.autotest && !UI.el.autotest.classList.contains('oculto');
    if (code === 'Escape') { if (panelTest) UI.el.autotest.classList.add('oculto'); else if (DRAG.estado === 'DRAGGING' || DRAG.sel) soltarTodo(); else alternarPausa(); ev.preventDefault(); return; }
    if (code === 'KeyP') { soltarTodo(); alternarPausa(); return; }
    if (code === 'KeyM') { alternarSonido(); return; }
    if (code === 'KeyG') { DEBUG.alternar(); return; }
    if (code === 'KeyT') { if (panelTest) UI.el.autotest.classList.add('oculto'); else DEBUG.autotest(); return; }
    if (code === 'KeyN' && ev.shiftKey) { saltarEstacion(); return; }
    if (code === 'Enter' && G.estado === 'MENU') { UI.jugar(); return; }
  }
  if (TECLAS_MOV[code]) { JUG.teclas[code] = abajo; ev.preventDefault(); }
}
function instalarEntradas() {
  const cv = R.renderer.domElement;
  cv.addEventListener('pointerdown', alBajar);
  cv.addEventListener('pointermove', alMover);
  cv.addEventListener('pointerup', alSubir);
  cv.addEventListener('pointercancel', alCancelar);
  cv.addEventListener('lostpointercapture', alCancelar);
  cv.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('blur', () => { for (const k in JUG.teclas) JUG.teclas[k] = false; alCancelar({ type: 'blur' }); soltarTodo(); });
  window.addEventListener('keydown', e => alTecla(e, true));
  window.addEventListener('keyup', e => alTecla(e, false));
  window.addEventListener('resize', alRedimensionar);
  // Si se pierde el contexto WebGL (equipos modestos), avisar en vez de quedar en negro
  cv.addEventListener('webglcontextlost', e => {
    e.preventDefault();
    const av = document.getElementById('aviso');
    av.textContent = 'La computadora reinició los gráficos. Recarga la página (tecla F5) para seguir jugando.';
    av.classList.remove('oculto');
  });
  // Al cambiar de pestaña: pausa automática; al volver, se reanuda el audio
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (G.estado !== 'MENU' && G.estado !== 'RESULTADO' && G.estado !== 'PAUSA') alternarPausa();
    } else if (AUD.ctx && AUD.ctx.state === 'suspended') { try { AUD.ctx.resume(); } catch (er) { } }
  });
}
function alRedimensionar() {
  R.renderer.setSize(window.innerWidth, window.innerHeight, false);
  R.camera.aspect = window.innerWidth / window.innerHeight;
  R.camera.updateProjectionMatrix();
  reencuadrar();
}

      { g: new THREE.SphereGeometry(0.03, 8, 6), m: M(0, 0.235, 0.09), c: 0xE5533D },
      { g: new THREE.SphereGeometry(0.024, 8, 6), m: M(0, 0.25, 0.05), c: 0xE5533D },
      { g: new THREE.BoxGeometry(0.12, 0.025, 0.16), m: M(0, 0.03, -0.18, -0.5, 0, 0), c: 0xD08850 },
      { g: new THREE.CylinderGeometry(0.012, 0.012, 0.09, 6), m: M(0.04, -0.15, 0.02), c: 0xB87333 },
      { g: new THREE.CylinderGeometry(0.012, 0.012, 0.09, 6), m: M(-0.04, -0.15, 0.02), c: 0xB87333 },

/* =====================================================================
   21. PISTAS (solo en modo mesa): 20 s brillo, 40 s chispas, 70 s Cucú lo hace
   ===================================================================== */
const PISTAS = {
  activo: false, t: 0, nivel: 0, conf: null, ocupado: false,
  armar(conf) { this.conf = conf; this.t = 0; this.nivel = 0; this.activo = true; this.limpiarVisual(); },
  desarmar() { this.activo = false; this.conf = null; this.limpiarVisual(); },
  progreso() { this.t = 0; this.nivel = 0; this.limpiarVisual(); },
  limpiarVisual() { EST.brillo = null; EST.bonusPieza = null; EST.pistaRanura = null; PART.sinCamino(); for (let i = 0; i < EST.relojes.length; i++) if (!DRAG.sel || DRAG.sel.obj.reloj !== EST.relojes[i]) EST.relojes[i].brillo = null; },
  update(dt) {
    if (!this.activo || !this.conf || this.ocupado || CAM.modo !== 'mesa' || !EST.interactivo || G.ayudando || EST.listoOcupado) return;
    if (DRAG.estado === 'DRAGGING' || DRAG.estado === 'SNAPPING' || DRAG.estado === 'RETURNING') return;
    this.t += dt;
    const P = CONFIG.PISTAS;
    if (this.nivel === 0 && this.t >= P.t1) this.dar(1);
    else if (this.nivel === 1 && this.t >= P.t2) this.dar(2);
    else if (this.nivel === 2 && this.t >= P.t3) this.dar(3);
  },
  dar(nivel) {
    this.nivel = nivel;
    const clave = this.conf.clave ? this.conf.clave() : null;
    if (!clave) return;
    usarPista(clave);
    if (clave.listo && nivel < 3) { decir(L.tocaListo, { interrumpir: true }); CUCU.hacerGesto('salto'); UI.pulsoListo(); return; }
    if (nivel === 1) {
      decir(this.conf.repetir || L.pistaMira, { interrumpir: true });
      CUCU.hacerGesto('salto');
      if (clave.pieza) { EST.brillo = clave.pieza; EST.bonusPieza = clave.pieza; }
      if (clave.mano) clave.mano.reloj.brillo = clave.mano.tipo;
    } else if (nivel === 2) {
      decir(L.pistaChispas, { interrumpir: true });
      if (clave.pieza) EST.pistaRanura = clave.ranura;
      const a = clave.desde(_v1), b = clave.hasta(_v2);
      PART.camino(a, b);
      CUCU.hacerGesto('salto');
    } else {
      this.ocupado = true;
      decir(L.pistaAyudo, { interrumpir: true });
      Promise.resolve(this.conf.hacer(clave)).catch(e => { if (e !== CANCEL) console.warn(e); }).then(() => { this.ocupado = false; this.progreso(); });
    }
  }
};
function usarPista(clave) {
  G.pistas++;
  if (clave && clave.pieza) marcarSucio(clave.pieza); else if (EST.item) EST.item.limpio = false;
}

/* =====================================================================
   22. ESTADÍSTICAS: aciertos a la primera por concepto

/* =====================================================================
   23. AYUDAS DEL GUÍA (misma lógica que el niño)
   ===================================================================== */
// Cucú lleva una pieza a su ranura
async function cucuColoca(p) {
  if (!p || p.colocada) return;
  let r = null;
  for (let i = 0; i < EST.ranuras.length; i++) { const q = EST.ranuras[i]; if (q.activa && q.llenos.length < q.capacidad && q.keys.indexOf(p.key) >= 0) { r = q; break; } }
  if (!r) return;
  G.ayudando = true;
  soltarTodo();
  try {
    const mesa = EST.mesa;
    CUCU.modo = 'libre';
    CUCU.irA(p.obj.position.x, mesa.y + 0.25, p.obj.position.z);
    await esperarC(null, () => CUCU.pos.distanceTo(CUCU.obj) < 0.08 || !p.obj.parent);
    if (p.colocada || !p.obj.parent) return;
    const x0 = p.obj.position.x, z0 = p.obj.position.z;
    await TW.p(p.obj, 0.9, e => {
      const x = lerp(x0, r.wx, e), z = lerp(z0, r.wz, e);
      p.obj.position.set(x, mesa.y + CONFIG.ARRASTRE.alturaPlano + Math.sin(e * Math.PI) * 0.1, z);
      CUCU.obj.set(x, mesa.y + 0.28 + Math.sin(e * Math.PI) * 0.1, z); CUCU.pos.copy(CUCU.obj);
    }, EASE.inOutSine);
    if (!p.colocada && p.obj.parent) {
      encajar(p, r, true);
      await esperarC(null, () => DRAG.estado !== 'SNAPPING');
    }
  } finally {
    CUCU.modo = 'guia';
    G.ayudando = false;
  }
}
// Cucú mueve las manecillas a la hora correcta (con "tic")
async function cucuMueve(reloj, h, modo) {
  G.ayudando = true;
  soltarTodo();
  try {
    const mesa = reloj.mesa, tipos = ['min', 'hora'];
    for (let i = 0; i < tipos.length; i++) {
      const m = reloj.manos[tipos[i]], obj = tipos[i] === 'min' ? anguloMin(modo) : anguloHora(h, modo);
      if (Math.abs(difAng(m.obj, obj)) < 1) continue;
      posPerilla(m, _v1);
      CUCU.modo = 'libre'; CUCU.irA(_v1.x, mesa.y + 0.3, _v1.z);
      await esperarC(null, () => CUCU.pos.distanceTo(CUCU.obj) < 0.1 || !reloj.g.parent);
      reloj.brillo = tipos[i];
      m.obj = obj;
      AUD.tic();
      const t0 = RELOJ.t;
      await esperarC(null, () => RELOJ.t - t0 > 0.75);
      reloj.aros[tipos[i]].visible = false;
    }
    reloj.brillo = null;
  } finally {
    CUCU.modo = 'guia';
    G.ayudando = false;
  }
}

/* =====================================================================
   24. CICLO DE CADA RETO: VER, HACER, ENTENDER y NOMBRAR
   ===================================================================== */
function bien() { return elegir(L.bien); }
// ENTENDER: se resalta qué manecilla dice qué
async function entender(A, reloj, segundos) {
  reloj.brillo = 'ambas';
  UI.etiquetas(reloj, true);
  await A.esperar(segundos || 2.2);

}
// NOMBRAR: letras grandes + voz
async function nombrar(A, texto, voz, icono) {
  UI.nombrar(texto, icono);
  AUD.acierto();
  await A.decir(T(texto, voz, 'cucu', icono));
  await A.esperar(0.5);
  UI.nombrar(null);
}
// Demostración animada (3 s) con otra hora para no regalar la respuesta
async function demoReloj(A, reloj, h, modo, corta) {

// HACER (tipo A) genérico: espera a que todas las piezas pedidas estén colocadas
async function pasoArrastre(A, cfg) {
  EST.interactivo = true;
  let erroresDistractor = 0;
  EST.onEncaje = (p, r, porGuia) => { if (cfg.alEncajar) cfg.alEncajar(p, r, porGuia); };
  EST.onError = (p, r) => {
    if (cfg.alError) cfg.alError(p, r);
    const objetivo = p.distractor ? (cfg.clave ? cfg.clave() : null) : p;
    const errs = p.distractor ? ++erroresDistractor : p.errores;
    if (errs >= CONFIG.ERRORES_AYUDA && objetivo && !objetivo.colocada) {     // tras 2 errores, el guía lo hace
      G.pistas++;
      marcarSucio(objetivo);
      decir(L.teAyudo, { interrumpir: true });
      cucuColoca(objetivo).catch(() => { });
    }
  };
  PISTAS.armar({
    repetir: cfg.repetir,
    clave: () => {
      const p = cfg.clave ? cfg.clave() : null;
      if (!p) return null;
      let r = null;
      for (let i = 0; i < EST.ranuras.length; i++) { const q = EST.ranuras[i]; if (q.activa && q.llenos.length < q.capacidad && q.keys.indexOf(p.key) >= 0) { r = q; break; } }

    },
    hacer: async clave => { if (clave && clave.pieza) await cucuColoca(clave.pieza); }
  });
  await A.hasta(() => cfg.listas() && DRAG.estado !== 'SNAPPING' && !G.ayudando);
  EST.interactivo = false; EST.onEncaje = null; EST.onError = null;
  PISTAS.desarmar(); soltarTodo();
}
function todasColocadas(lista) { for (let i = 0; i < lista.length; i++) if (!lista[i].colocada) return false; return true; }

  if (G.ctxIntro && G.ctxIntro.vivo) { G.ctxIntro.vivo = false; return; }
  if (G.estacionActiva < 0 || !G.ctxEst || !G.ctxEst.vivo) return;

async function correrEstacion(i) {
  const ctx = nuevoCtx(), A = ayudante(ctx);

  if (i > 0) UI.teclas(false);
  G.estado = i === 0 ? 'TUTORIAL' : 'EST' + i;
  EST.idx = i; EST.mesa = MESAS[i];
  G.estacionActiva = i; G.estacionLista = false;
  MUNDO.luzMesa.position.set(MESAS[i].x, 2.7, MESAS[i].z);
  CUCU.modo = 'guia';

  try { await ESTACIONES[i](A); }
  catch (e) { if (e !== CANCEL) console.error('Error en la estación ' + i, e); }
  ctx.vivo = false;
  // Cierre: engranaje (estaciones 1 a 5), salir de la mesa y limpiar
  const B = ayudante(nuevoCtx());
  EST.interactivo = false; PISTAS.desarmar(); soltarTodo(); UI.listo(null);
  await B.hasta(() => !G.ayudando && DRAG.estado !== 'SNAPPING' && G.estado !== 'PAUSA');
  if (i >= 1 && i <= 5 && G.engranajes < i) { try { await premioEngranaje(B, i); } catch (e) { console.warn(e); } }

    await B.esperar(0.5);

}
function probarDiseno(dz, ok) {
  const mesa = dz.mesa, l = dz.l, nom = dz.nombre;
  const ran = l.ranuras.map(r => { mesaAMundo(mesa, r.lx, r.lz, _mun); return { id: r.id, keys: r.keys, wx: _mun.x, wz: _mun.z, radius: r.radio, activa: true, llenos: [], capacidad: 1, accepts: aceptaPieza }; });
  let todoBien = true;
  const fallo = t => { todoBien = false; ok(nom + ': ' + t, false); };
  for (let i = 0; i < ran.length; i++) {
    const r = l.ranuras[i];
    if (Math.abs(r.lx) + r.radio > 1.3 || Math.abs(r.lz) + r.radio > 0.7) fallo('ranura ' + r.id + ' fuera del tablero');
    if (!enVista(mesa, r.lx, r.lz, 0)) fallo('ranura ' + r.id + ' fuera de la vista');
  }
  for (let i = 0; i < l.piezas.length; i++) {
    const s = l.piezas[i];
    mesaAMundo(mesa, s.lx, s.lz, _mun);
    const pz = { key: s.key }, hx = _mun.x, hz = _mun.z;
    const hw = s.forma === 'tarjeta' ? s.w / 2 : (s.forma === 'mano' ? 0.22 : (s.r || 0.14)), hd = s.forma === 'tarjeta' ? s.d / 2 : (s.forma === 'mano' ? 0.05 : (s.r || 0.14));
    if (Math.abs(s.lx) + hw > 1.3 || Math.abs(s.lz) + hd > 0.7) fallo('pieza ' + s.id + ' fuera del tablero');
    if (!enVista(mesa, s.lx, s.lz, 0.03)) fallo('pieza ' + s.id + ' fuera de la vista');
    const acepta = ran.filter(r => r.keys.indexOf(s.key) >= 0);
    if (s.distractor) { if (acepta.length) fallo('el distractor ' + s.id + ' tiene ranura'); }
    else {
      if (!acepta.length) fallo('pieza ' + s.id + ' sin ranura que la acepte');
      for (let k = 0; k < acepta.length; k++) {
        const r = acepta[k];
        const c = findCandidate(pz, r.wx, r.wz, ran, 0);
        if (!c || c.ranura !== r) fallo(s.id + ' no encaja en ' + r.id);
        const c2 = findCandidate(pz, r.wx + r.radius * 0.9, r.wz, ran, 0);
        if (!c2 || c2.ranura.keys.indexOf(s.key) < 0) fallo(s.id + ' no encaja cerca de ' + r.id);
      }
    }
    if (findCandidate(pz, hx, hz, ran, CONFIG.ARRASTRE.extraPista)) fallo(s.id + ' encaja desde su lugar de inicio');
    // Un lugar lejano (esquina opuesta del tablero) nunca encaja
    mesaAMundo(mesa, s.lx > 0 ? -1.25 : 1.25, 0.65, _mun);
    const lejos = findCandidate(pz, _mun.x, _mun.z, ran, 0);
    if (lejos && Math.hypot(lejos.ranura.wx - _mun.x, lejos.ranura.wz - _mun.z) > lejos.ranura.radius + CONFIG.ARRASTRE.extraEncaje) fallo(s.id + ' encaja en un lugar lejano');
    // Toca y toca: la pieza se puede elegir (ninguna otra le tapa el centro)
    for (let k = 0; k < l.piezas.length; k++) {
      if (k === i) continue;
      const o = l.piezas[k], dd = Math.hypot(o.lx - s.lx, o.lz - s.lz);
      if (dd < 0.08) fallo(s.id + ' tapada por ' + o.id);
    }
    // Soltar sobre una ranura que no la acepta se reconoce como error (no encaja allí)
    for (let k = 0; k < ran.length; k++) {
      const r = ran[k];
      if (r.keys.indexOf(s.key) >= 0) continue;
      const c = findCandidate(pz, r.wx, r.wz, ran, 0);
      if (c && c.ranura === r) fallo(s.id + ' encaja en una ranura ajena ' + r.id);
    }
  }
  ok(nom + ': piezas, ranuras, vista y toca y toca', todoBien);
}
function lineasDePrueba() {
  const out = [], H = [], D = [0, 1, 2, 3, 4, 5, 6], D6 = [0, 1, 2, 3, 4, 5], M2 = [];
  for (let h = 1; h <= 12; h++) H.push(h);
  for (let m = 1; m <= 11; m++) M2.push(m);
  const pruebas = { ayudante: ['Ayudante', 'Ana María'], gracias: ['Ayudante', 'Ana María'], cortaEn: H, cortaEntre: H, errCortaEn: H, leerErrPunto: H,
    semErr: D, hoyEs: D, ayerFue: D, mananaSera: D, diaDespues: D6, diaErr: D6, diaBien: D6, mesesErr: M2, engranaje: [1, 2, 3, 4, 5] };
  for (const k in CONTENIDO) {
    const v = CONTENIDO[k];
    if (typeof v === 'function') {
      if (v.length === 2) { for (let h = 1; h <= 12; h++) { out.push(v(h, false)); out.push(v(h, true)); } }
      else { const args = pruebas[k] || [1]; for (let i = 0; i < args.length; i++) out.push(v(args[i])); }
    } else if (Array.isArray(v)) { for (let i = 0; i < v.length; i++) out.push(v[i]); }
    else if (v && v.sub) out.push(v);
    else if (v && typeof v === 'object') { for (const j in v) out.push(v[j]); }
  }
  for (const k in OBJ) { const o = OBJ[k]; if (typeof o === 'function') out.push({ sub: (o.length === 2 ? o(12, true) : o(3))[1] }); else out.push({ sub: o[1] }); }
  for (let h = 1; h <= 12; h++) { out.push({ sub: horaTxt(h, false) }); out.push({ sub: horaTxt(h, true) }); }
  return out;
}

/* =====================================================================
   30. BUCLE PRINCIPAL (requestAnimationFrame, dt con tope de 0.05 s)
   ===================================================================== */
let _ultimo = 0, _fpsT = 0, _fpsN = 0, _fpsBajo = 0, _degradaciones = 0;
function medirFPS(real) {
  _fpsT += real; _fpsN++;
  if (_fpsT < 0.5) return;
  G.fps = _fpsN / _fpsT; _fpsT = 0; _fpsN = 0;
  if (G.estado === 'PAUSA' || document.hidden) { _fpsBajo = 0; return; }
  if (G.fps < CONFIG.RENDER.fpsMin) _fpsBajo += 0.5; else _fpsBajo = 0;
  if (_fpsBajo >= CONFIG.RENDER.fpsVentana && _degradaciones < 3) {   // menos de 40 FPS durante 3 s: bajar calidad
    _fpsBajo = 0; _degradaciones++;
    R.pr = Math.max(CONFIG.RENDER.prMin, R.pr * 0.8);
    R.renderer.setPixelRatio(R.pr);
    R.renderer.setSize(window.innerWidth, window.innerHeight, false);
    PART.ajustarPolvo(Math.floor(PART.polvo * 0.5));
  }
}
function orbitaMenu(dt) {
  G.menuAng += dt * 0.07;
  CAM.modo = 'menu';
  R.camera.position.set(Math.sin(G.menuAng) * 1.2, 2.0, Math.cos(G.menuAng) * 1.2);
  R.camera.lookAt(Math.sin(G.menuAng + 2.8) * 7, 2.6, Math.cos(G.menuAng + 2.8) * 7);
}
function bucle(ahora) {
  requestAnimationFrame(bucle);
  const real = _ultimo ? (ahora - _ultimo) / 1000 : 0.016;
  _ultimo = ahora;
  const dt = Math.min(CONFIG.DT_MAX, Math.max(0, real)) * G.escalaTiempo;
  medirFPS(Math.max(0, real));
  if (G.estado !== 'PAUSA') {
    RELOJ.t += dt;
    const t = RELOJ.t;
    if (G.estado === 'MENU') orbitaMenu(dt);
    actualizarJugador(dt);
    revisarCercania(dt);
    actualizarCamara(dt);
    TW.update(dt);
    actualizarEsperas();
    actualizarRelojes(dt, t);
    if (EST.alActualizar) EST.alActualizar(dt, t);
    CUCU.update(dt, t);
    PISTAS.update(dt);
    actualizarMundo(dt, t);
    PART.update(dt, t);
    UI.actualizar(dt);
  }
  R.renderer.render(R.scene, R.camera);
  if (DEBUG.visible) DEBUG.update();
}

   31. INICIO
   ===================================================================== */
function iniciar() {
  try {
    crearRender();
  } catch (e) {
    const av = document.getElementById('aviso');
    av.textContent = 'Este navegador no puede mostrar gráficos 3D (WebGL). Prueba con Chrome actualizado.';
    av.classList.remove('oculto');

  }
  UI.iniciar();
  crearTexturas();
  crearMateriales();
  construirMundo();
  CUCU.crear();
  PART.crear();
  instalarEntradas();
  alRedimensionar();
  window.__juego = { G: G, EST: EST, DRAG: DRAG, CAM: CAM, CUCU: CUCU, MESAS: MESAS, JUG: JUG, R: R, UI: UI, DEBUG: DEBUG, PISTAS: PISTAS,
    PART: PART, nearestMark: nearestMark, findCandidate: findCandidate, mesaAMundo: mesaAMundo, posPerilla: posPerilla, RELOJ: RELOJ, AUD: AUD };
  requestAnimationFrame(bucle);
}
